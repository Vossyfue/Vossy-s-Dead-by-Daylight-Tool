
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBD Tools by aVossyfue - Anmeldung</title>
<style>
    :root {
        --background: #16171C;
        --panel: #1D1E23;
        --accent: #4FA8E8;
        --text: #E6E6E6;
        --muted: #9A9DA8;
        --border: #3A3F4C;
        --error: #E85B5B;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
    }
    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px 36px;
        max-width: 380px;
        width: 90%;
        text-align: center;
    }
    .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
    }
    .icon.success { background: #3FA34D; }
    .icon.error { background: var(--error); }
    h1 {
        font-size: 18px;
        margin: 0 0 8px;
    }
    p {
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.5;
        margin: 0 0 4px;
    }
    .hint {
        margin-top: 24px;
        font-size: 11.5px;
        color: var(--muted);
        opacity: 0.75;
    }
    .retry-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
    }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="icon success" id="icon">&#10003;</div>
        <h1 id="title">Anmeldung erfolgreich</h1>
        <p id="message">Du wirst zurück zu DBD Tools by aVossyfue weitergeleitet...</p>
        <p class="hint" id="hint">Falls sich die App nicht automatisch öffnet, kannst du dieses Fenster einfach schließen und sie manuell öffnen.</p>
    </div>

<script>
    // Liest die Rueckgabe-Parameter aus der URL (Supabase haengt bei PKCE
    // entweder "?code=..." bei Erfolg oder "?error=...&error_description=..."
    // bei einem Fehlschlag an) und reicht sie per Custom-URL-Schema an die
    // App weiter. Diese Seite ersetzt den direkten Sprung zu
    // "dbdtools://auth-callback", der vorher zu einem endlos ladenden,
    // leeren Browser-Tab fuehrte.
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const errorDescription = params.get("error_description") || params.get("error");

    if (code) {
        window.location.href = "dbdtools://auth-callback?code=" + encodeURIComponent(code);
    } else if (errorDescription) {
        document.getElementById("icon").className = "icon error";
        document.getElementById("icon").innerHTML = "&#10007;";
        document.getElementById("title").textContent = "Anmeldung fehlgeschlagen";
        document.getElementById("message").textContent = decodeURIComponent(errorDescription.replace(/\+/g, " "));
        document.getElementById("hint").textContent = "Du kannst dieses Fenster schließen und den Login in der App erneut versuchen.";
    } else {
        document.getElementById("icon").className = "icon error";
        document.getElementById("icon").innerHTML = "&#10007;";
        document.getElementById("title").textContent = "Unerwartete Antwort";
        document.getElementById("message").textContent = "Es wurden keine Anmeldedaten übermittelt.";
    }
</script>
</body>
</html>
